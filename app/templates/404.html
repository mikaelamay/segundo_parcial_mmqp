{% extends "base.html" %}

{% block title %}Página no encontrada{% endblock %}

{% block content %}
<div class="card mx-auto" style="max-width: 620px;">
  <div class="card-body text-center py-5">
    <div class="display-4 fw-bold text-success mb-2">404</div>
    <h1 class="h3 fw-bold">Página no encontrada</h1>
    <p class="text-muted mb-4">
      La dirección que intentaste abrir no existe o fue movida.
    </p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">
      <i class="bi bi-house-door me-1"></i> Volver al inicio
    </a>
  </div>
</div>
{% endblock %}
